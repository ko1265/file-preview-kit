<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>File Preview Kit Demo</title>
    <script type="module" src="./main.ts"></script>
    <style>
      :root {
        color-scheme: light;
        font-family: "Space Grotesk", "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top, rgba(244, 114, 182, 0.18), transparent 26%),
          radial-gradient(circle at right, rgba(34, 197, 94, 0.14), transparent 32%),
          #f8fafc;
        color: #0f172a;
      }

      body {
        margin: 0;
        min-height: 100vh;
      }

      main {
        width: min(1120px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 48px 0 80px;
        display: grid;
        gap: 24px;
      }

      header {
        display: grid;
        gap: 10px;
        max-width: 760px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.3rem, 4vw, 4.6rem);
        line-height: 0.95;
        letter-spacing: -0.06em;
      }

      p {
        margin: 0;
        color: #334155;
        line-height: 1.65;
      }

      .controls {
        display: grid;
        grid-template-columns: 1.3fr 0.8fr auto;
        gap: 12px;
        padding: 14px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.82);
        backdrop-filter: blur(12px);
        box-shadow: 0 22px 44px rgba(15, 23, 42, 0.08);
      }

      input,
      button,
      select {
        border: 0;
        border-radius: 14px;
        padding: 14px 16px;
        font: inherit;
      }

      input,
      select {
        background: #e2e8f0;
      }

      button {
        background: #0f172a;
        color: white;
        cursor: pointer;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
      }

      .sample {
        padding: 16px;
        border-radius: 18px;
        border: 1px solid rgba(15, 23, 42, 0.08);
        background: rgba(255, 255, 255, 0.75);
        text-align: left;
      }

      .sample strong,
      .sample span {
        display: block;
      }

      .sample strong {
        margin-bottom: 6px;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p>Standalone open-source preview library</p>
        <h1>Remote file preview with Web Components.</h1>
        <p>
          This demo renders files directly from remote URLs with a plugin-driven client-side architecture.
          PDF, text, code, image, audio, video, and early Office Open XML hooks are included in the v0.1 foundation.
        </p>
      </header>
      <section class="controls">
        <input id="src-input" type="url" placeholder="https://example.com/readme.md" />
        <select id="sample-select"></select>
        <button id="load-button" type="button">Load preview</button>
      </section>
      <div class="grid" id="sample-grid"></div>
      <file-preview id="preview"></file-preview>
    </main>
  </body>
  </html>
